<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>4人オンライン麻雀</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1>🀄 4人オンライン麻雀</h1>
    <p class="sub">Firebase不要・Supabase Realtime版 / 賭けなし</p>

    <section id="lobby" class="card">
      <label>名前</label>
      <input id="nameInput" maxlength="12" placeholder="プレイヤー名">
      <div class="row">
        <button id="createBtn">部屋を作る</button>
        <input id="roomInput" maxlength="8" placeholder="部屋ID">
        <button id="joinBtn">参加する</button>
      </div>
      <p id="status" class="status"></p>
      <details>
        <summary>Supabase設定</summary>
        <p><code>supabase.js</code> に自分の Project URL と Publishable key を入れてください。</p>
      </details>
    </section>

    <section id="room" class="hidden">
      <div class="topbar card">
        <div><b>部屋:</b> <span id="roomIdLabel">-</span></div>
        <button id="copyBtn">招待URLをコピー</button>
      </div>

      <div class="table card">
        <div class="seat seat-top" id="seat2"></div>
        <div class="seat seat-left" id="seat3"></div>
        <div class="center">
          <div class="wall">山牌: <span id="wallCount">-</span></div>
          <div id="turnLabel">待機中</div>
          <div class="message" id="gameMessage">4人揃うと開始できます</div>
        </div>
        <div class="seat seat-right" id="seat1"></div>
        <div class="seat seat-bottom" id="seat0"></div>
      </div>

      <div class="hand-area card">
        <h2>あなたの手牌</h2>
        <div id="hand" class="hand"></div>
        <div class="actions">
          <button id="drawBtn" disabled>ツモ</button>
          <button id="discardBtn" disabled>選択牌を切る</button>
        </div>
      </div>

      <div class="card">
        <h2>この版でできること</h2>
        <ul>
          <li>4人部屋・招待URL</li>
          <li>PC / スマホ対応</li>
          <li>ツモ・打牌のリアルタイム同期</li>
          <li>点数表示（開始25,000点）</li>
        </ul>
        <p class="note">※これは賭けなしのゲーム用プロトタイプです。チー・ポン・カン、リーチ、和了判定、役・点数計算などは追加実装できます。</p>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="game.js"></script>
</body>
</html>
